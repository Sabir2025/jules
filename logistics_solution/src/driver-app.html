<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
      .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
      .btn-primary { background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%); }
    </style>
  </head>
  <body class="p-6">
    <div id="booking-form" class="max-w-md mx-auto space-y-6">
      <div class="text-center">
        <h1 class="text-2xl font-bold mb-2">Бронирование рейса</h1>
        <p class="text-slate-400" id="cargo-info">Загрузка данных...</p>
      </div>

      <div class="glass p-6 rounded-2xl space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Ваше имя</label>
          <input type="text" id="driver-name" class="w-full bg-slate-800 border border-slate-700 px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Александр">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Номер телефона</label>
          <input type="tel" id="driver-phone" class="w-full bg-slate-800 border border-slate-700 px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="+7 700 000 0000">
        </div>

        <button onclick="confirmBooking()" id="confirm-btn" class="w-full btn-primary py-4 rounded-xl font-bold text-white shadow-lg">
          Подтвердить и взять рейс
        </button>
      </div>
    </div>

    <div id="success-message" class="hidden max-w-md mx-auto text-center space-y-4 py-10">
      <div class="bg-emerald-500/20 text-emerald-500 w-20 h-20 rounded-full flex items-center justify-center mx-auto text-4xl">✓</div>
      <h2 class="text-2xl font-bold">Вы подтвердили взятие рейса!</h2>
      <p class="text-slate-400">С вами свяжутся, будьте на связи.</p>
    </div>

    <script>
      // Get cargoId from URL
      const urlParams = new URLSearchParams(window.location.search);
      const cargoId = urlParams.get('cargoId'); // Passed by Telegram

      async function confirmBooking() {
        const name = document.getElementById('driver-name').value;
        const phone = document.getElementById('driver-phone').value;

        if (!name || !phone) {
          alert('Пожалуйста, заполните все поля');
          return;
        }

        const btn = document.getElementById('confirm-btn');
        btn.disabled = true;
        btn.innerText = 'Обработка...';

        google.script.run
          .withSuccessHandler(res => {
            if (res.success) {
              document.getElementById('booking-form').classList.add('hidden');
              document.getElementById('success-message').classList.remove('hidden');
            } else {
              alert(res.message);
              btn.disabled = false;
              btn.innerText = 'Подтвердить и взять рейс';
            }
          })
          .confirmCargo(cargoId, name, phone);
      }
    </script>
  </body>
</html>
