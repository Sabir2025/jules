<script type="text/template" id="auth-template">
  <div class="flex flex-col space-y-6 mt-10">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-white mb-2">MoveX</h1>
      <p class="text-slate-400">Система управления логистикой</p>
    </div>

    <div class="glass p-6 rounded-2xl shadow-xl">
      <div id="auth-tabs" class="flex mb-6 border-b border-slate-700">
        <button onclick="switchAuth('login')" id="btn-tab-login" class="flex-1 pb-2 border-b-2 border-indigo-500 font-medium">Вход</button>
        <button onclick="switchAuth('reg')" id="btn-tab-reg" class="flex-1 pb-2 border-slate-700 text-slate-400 font-medium">Регистрация</button>
      </div>

      <form id="auth-form" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-sm font-medium text-slate-300 mb-1">Ваше имя</label>
          <input type="text" id="auth-name" class="w-full px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Иван Иванов">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Номер телефона</label>
          <input type="tel" id="auth-phone" class="w-full px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="+7 700 000 0000">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Пароль</label>
          <input type="password" id="auth-pass" class="w-full px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
        </div>
        <button type="button" onclick="handleAuth()" id="auth-submit-btn" class="w-full btn-primary py-4 rounded-xl font-bold text-white shadow-lg mt-4">
          Войти
        </button>
        <p id="auth-error" class="text-red-400 text-sm text-center mt-2 hidden"></p>
      </form>
    </div>
  </div>
</script>

<script>
    function switchAuth(mode) {
      const nameField = document.getElementById('name-field');
      const btnLogin = document.getElementById('btn-tab-login');
      const btnReg = document.getElementById('btn-tab-reg');
      const btnSubmit = document.getElementById('auth-submit-btn');

      if (mode === 'login') {
        nameField.classList.add('hidden');
        btnLogin.classList.add('border-indigo-500');
        btnLogin.classList.remove('text-slate-400');
        btnReg.classList.remove('border-indigo-500');
        btnReg.classList.add('text-slate-400');
        btnSubmit.innerText = 'Войти';
      } else {
        nameField.classList.remove('hidden');
        btnLogin.classList.remove('border-indigo-500');
        btnLogin.classList.add('text-slate-400');
        btnReg.classList.add('border-indigo-500');
        btnReg.classList.remove('text-slate-400');
        btnSubmit.innerText = 'Создать аккаунт';
      }
    }

    async function handleAuth() {
      const phone = document.getElementById('auth-phone').value;
      const pass = document.getElementById('auth-pass').value;
      const name = document.getElementById('auth-name').value;
      const errorEl = document.getElementById('auth-error');

      errorEl.classList.add('hidden');

      const isReg = !document.getElementById('name-field').classList.contains('hidden');

      if (!phone || !pass || (isReg && !name)) {
        errorEl.innerText = 'Заполните все поля';
        errorEl.classList.remove('hidden');
        return;
      }

      try {
        const action = isReg ? 'register' : 'login';
        const res = await callApi(action, { phone, password: pass, name });

        if (res.success) {
          if (isReg) {
            switchAuth('login');
            alert('Регистрация успешна! Теперь войдите.');
          } else {
            currentUser = res.user;
            localStorage.setItem('movex_user', JSON.stringify(currentUser));
            showDashboard();
          }
        } else {
          errorEl.innerText = res.message;
          errorEl.classList.remove('hidden');
        }
      } catch (e) {
        errorEl.innerText = 'Ошибка соединения: ' + e.message;
        errorEl.classList.remove('hidden');
      }
    }
</script>
