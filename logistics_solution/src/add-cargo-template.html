<script type="text/template" id="add-cargo-template">
  <div class="flex flex-col space-y-6">
    <div class="flex items-center space-x-4">
      <button onclick="showDashboard()" class="p-2 glass rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <h2 class="text-xl font-bold">Добавить груз</h2>
    </div>

    <form id="add-cargo-form" class="glass p-6 rounded-2xl space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Маршрут (Откуда - Куда)</label>
        <input type="text" id="c-route" class="w-full px-4 py-3 rounded-xl outline-none" placeholder="Алматы - Астана">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Что везем (Груз)</label>
        <input type="text" id="c-cargo" class="w-full px-4 py-3 rounded-xl outline-none" placeholder="Продукты питания">
      </div>
      <div class="flex space-x-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-slate-400 mb-1">Вес/Объем</label>
          <input type="text" id="c-weight" class="w-full px-4 py-3 rounded-xl outline-none" placeholder="20т / 82м3">
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-slate-400 mb-1">Ставка (₸)</label>
          <input type="number" id="c-price" class="w-full px-4 py-3 rounded-xl outline-none" placeholder="450000">
        </div>
      </div>

      <button type="button" onclick="submitCargo()" id="cargo-submit-btn" class="w-full btn-primary py-4 rounded-xl font-bold text-white shadow-lg mt-4">
        Опубликовать в Telegram
      </button>
    </form>
  </div>

  <script>
    async function submitCargo() {
      const data = {
        route: document.getElementById('c-route').value,
        cargo: document.getElementById('c-cargo').value,
        weight: document.getElementById('c-weight').value,
        price: document.getElementById('c-price').value,
        userPhone: currentUser.phone
      };

      if (!data.route || !data.cargo || !data.price) {
        alert('Пожалуйста, заполните основные поля');
        return;
      }

      const btn = document.getElementById('cargo-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader ease-linear rounded-full border-2 border-t-2 border-white h-5 w-5 inline-block mr-2"></span> Загрузка...';

      try {
        const res = await callApi('addCargo', data);
        if (res.success) {
          alert('Груз успешно опубликован!');
          showDashboard();
        }
      } catch (e) {
        alert('Ошибка: ' + e.message);
        btn.disabled = false;
        btn.innerHTML = 'Опубликовать в Telegram';
      }
    }
  </script>
</script>
